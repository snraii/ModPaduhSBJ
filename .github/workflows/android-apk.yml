
name: Build Advance Booking Alert APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p source
          unzip -q AdvanceBookingAlert-V3-LiveScan-Source-NEW.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AdvanceBookingAlert-V3-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
