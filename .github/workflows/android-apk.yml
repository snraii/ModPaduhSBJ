

name: Build Advance Booking Alert APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p source
          unzip -q SBJCANTAS-TURBO-V4-Source.zip -d source
      - name: Fix Java and Kotlin versions
        run: |
          cat > source/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.advancebookingalert"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.advancebookingalert"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AdvanceBookingAlert-V3-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
