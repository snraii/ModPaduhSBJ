
name: Build SBJ CANTAS TURBO V6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p source
          unzip -q SBJ-CANTAS-TURBO-V5-DESIGN-REBUILD.zip -d source
          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -60

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find source -type f -path '*/app/build.gradle.kts' -print -quit | sed 's#/app/build.gradle.kts$##')
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Configure Java and Kotlin
        run: |
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.advancebookingalert"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.advancebookingalert"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 6
                  versionName = "6.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBJ-CANTAS-TURBO-V6-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
